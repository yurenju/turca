<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PROTOTYPE · 右手打拍</title>
    <style>
      body { font: 14px system-ui, sans-serif; margin: 16px; background: #111; color: #eee; }
      .banner { background: #a33; padding: 4px 8px; display: inline-block; margin-bottom: 8px; }
      .row { display: flex; gap: 16px; flex-wrap: wrap; align-items: flex-start; }
      .stage { position: relative; width: 640px; max-width: 100%; }
      .stage video, .stage canvas { width: 100%; display: block; transform: scaleX(-1); }
      .stage canvas { position: absolute; inset: 0; }
      #chart { width: 100%; max-width: 1000px; height: 200px; background: #000; display: block; margin-top: 8px; }
      #stats { font: 13px ui-monospace, monospace; white-space: pre; background: #000; padding: 8px; min-width: 320px; }
      #controls label { display: block; margin: 6px 0; }
      #controls input[type=range] { width: 180px; vertical-align: middle; }
      button { font-size: 16px; padding: 6px 14px; margin-right: 8px; }
      .legend span { margin-right: 16px; }
    </style>
  </head>
  <body>
    <div class="banner">PROTOTYPE — 用完就丟（地圖 #1、票 #2）</div>
    <div>
      <button id="start">開始（開鏡頭與聲音）</button>
      <button id="reset">重來（回到預備拍）</button>
      <button id="stop">停止音樂</button>
      <button id="copy">複製紀錄</button>
      <span>模型：<a href="?model=hand">手部</a> · <a href="?model=pose">全身姿勢</a> ·
        <a href="?model=hand&delegate=CPU">手部 CPU</a></span>
    </div>
    <p>站在鏡頭前 1–2 公尺，右手上下打拍。第一下只量速度，第二下之後音樂才開始。</p>
    <div class="row">
      <div class="stage"><video id="video" playsinline muted></video><canvas id="overlay"></canvas></div>
      <div id="stats">按「開始」</div>
      <div id="controls"></div>
    </div>
    <canvas id="chart"></canvas>
    <div class="legend">
      <span style="color:#6cf">— 手腕高度（越低越往下）</span>
      <span style="color:#f55">│ 偵測到的手的拍點</span>
      <span style="color:#fd4">│ 聽到的音樂拍子</span>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
